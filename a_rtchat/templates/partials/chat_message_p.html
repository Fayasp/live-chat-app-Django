
<div id="chat_messages" hx-swap-oob="beforeend">

<div class="fade-in-type">
    {% include "a_rtchart/chat_message.html" %}
</div>

<style>
    @keyframes fadeInAndUp {
        from {opacity: 0; transform: translateY(12px);}
        to {opacity: 1;transform: translateY(0px);}
    }

    .fade-in-type {
        animation: fadeInAndUs 0.6s ease;
    }
</style>
<script>
    scrollToBottom(100)
</script>
</div>


{% with message.auther as user %}
{% if user in chat_group.users_online.all %}
<div id="user-{{ user.id}}" class="green-dot border-2 border-grey-800 absolute -bottom-1 -right-1"></div>
{% else %}
<div id="user-{{ user.id}}" class="grey-dot border-2 border-grey-800 absolute -bottom-1 -right-1"></div>
{% endif %}


{% endwith %}
